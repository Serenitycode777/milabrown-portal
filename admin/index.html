  function fieldHtml(table, f, v) {
    const id = `${table}-${f.k}`, val = v === undefined || v === null ? (typeof f.d === "function" ? f.d() : f.d ?? "") : v;
    const w = f.wide ? ' class="wide"' : "";
    if (f.t === "check") return `<label class="check"${w}><input type="checkbox" id="${id}" ${val ? "checked" : ""}> ${f.l}</label>`;
    if (f.t === "textarea") return `<label${w} for="${id}">${f.l}<textarea id="${id}">${esc(val)}</textarea></label>`;
    if (f.t === "select") { const o = typeof f.o === "function" ? f.o() : f.o; return `<label${w} for="${id}">${f.l}<select id="${id}">${o.map(([a, b]) => `<option value="${esc(a)}" ${String(val) === String(a) ? "selected" : ""}>${esc(b)}</option>`).join("")}</select></label>`; }
    if (f.t === "list") return `<label${w} for="${id}">${f.l}<input id="${id}" list="${id}-dl" value="${esc(val)}"><datalist id="${id}-dl">${f.src().map((x) => `<option value="${esc(x)}">`).join("")}</datalist></label>`;
    if (f.t === "file") return `<label${w} for="${id}">${f.l}${val ? ` <span class="small muted" style="text-transform:none;letter-spacing:0">current: ${esc(String(val).split("/").pop())}</span>` : ""}<input id="${id}" type="file"></label>`;
    if (f.t === "audience") {
      const ids = Array.isArray(v) ? v : [], some = ids.length > 0;
      const ppl = DB.profiles.map((p) => ({ id: p.id, name: p.full_name || p.email || "(no name)", email: p.email || "" })).sort((a, b) => a.name.localeCompare(b.name));
      return `<fieldset class="multi audience wide" id="${id}"><legend>${f.l}</legend>
        <div class="aud-mode"><label class="check"><input type="radio" name="${id}-mode" value="all" ${some ? "" : "checked"}> All clients</label>
        <label class="check"><input type="radio" name="${id}-mode" value="some" ${some ? "checked" : ""}> Only chosen clients</label></div>
        <div class="checks aud-list" ${some ? "" : "hidden"}>${ppl.length ? ppl.map((p) => `<label class="check"><input type="checkbox" value="${esc(p.id)}" ${ids.includes(p.id) ? "checked" : ""}> ${esc(p.name)}${p.email && p.email !== p.name ? ` <span class="small muted">${esc(p.email)}</span>` : ""}</label>`).join("") : `<p class="small muted">No clients with Serene Portal access yet.</p>`}</div></fieldset>`;
    }
    if (f.t === "multi") {
      const chosen = split(val), opts = [...new Set([...f.o(), ...chosen])];
      return `<fieldset class="multi${f.wide ? " wide" : ""}" id="${id}"><legend>${f.l}</legend><div class="checks">${opts.map((o) => `<label class="check"><input type="checkbox" value="${esc(o)}" ${chosen.includes(o) ? "checked" : ""}> ${esc(o)}</label>`).join("")}</div>
        ${f.add ? `<div class="add-row"><input type="text" placeholder="Add new…" maxlength="30" aria-label="Add new ${esc(f.l)}"><button class="btn ghost sm" type="button" data-addopt="${id}">Add</button></div>` : ""}</fieldset>`;
    }
    return `<label${w} for="${id}">${f.l}<input id="${id}" type="${f.t}" value="${esc(val)}"></label>`;
  }
  function formHtml(table, title, row, extraBtns) {
    const e = row && row.id;
    return `<form class="panel" data-form="${table}" novalidate><h3>${title}</h3><div class="fgrid">${F[table].map((f) => fieldHtml(table, f, row ? row[f.k] : undefined)).join("")}</div>
      <div class="actions"><button class="btn" type="submit">${e ? "Save changes" : "Add"}</button>${e && !extraBtns ? `<button class="btn ghost" type="button" data-cancel="${table}">Cancel</button>` : ""}${extraBtns || ""}</div></form>`;
  }
  function readForm(table) {
    const out = {}, files = {};
    for (const f of F[table]) {
      const el = $(`${table}-${f.k}`); if (!el) continue;
      if (f.t === "check") out[f.k] = el.checked;
      else if (f.t === "file") { if (el.files[0]) files[f.k] = { file: el.files[0], bucket: f.bucket }; }
      else if (f.t === "multi") out[f.k] = [...el.querySelectorAll(".checks input:checked")].map((x) => x.value).join(", ") || null;
      else if (f.t === "audience") {
        const mode = (el.querySelector('input[type="radio"]:checked') || {}).value;
        out[f.k] = mode === "some" ? [...el.querySelectorAll(".aud-list input:checked")].map((x) => x.value) : null;
        if (mode === "some" && !out[f.k].length) throw new Error("Choose at least one client, or pick “All clients”.");
      }
      else if (f.t === "number") out[f.k] = el.value === "" ? null : Number(el.value);
      else out[f.k] = el.value.trim() === "" ? null : el.value.trim();
      if (f.req && !out[f.k]) { el.focus(); throw new Error(`Please fill in “${f.l}”.`); }
    }
    return { out, files };
  }

  // ---------- data ----------
  async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
  async function loadAll() {
    if (DEMO) { if (!DB.profiles.length) demoData(); return; }
    const opt = (p) => p.then((r) => (r.error ? [] : r.data)); // old tables may be missing in a fresh project
    const [inq, crm, p, m, l, r, em, inb, bk] = await Promise.all([
      opt(sb.from("inquiries").select("*").order("created_at", { ascending: false })),
      opt(sb.from("milabrownclients").select("*").order("created_at", { ascending: false })),
      q(sb.from("profiles").select("*").order("created_at", { ascending: false })),
      q(sb.from("modalities").select("*").order("sort")),
      q(sb.from("library_items").select("*").order("created_at", { ascending: false })),
      q(sb.from("retreats").select("*").order("starts_on", { ascending: false, nullsFirst: true })),
      opt(sb.from("email_log").select("*").order("sent_at", { ascending: false })),
      opt(sb.from("email_inbox").select("*").eq("archived", false).order("received_at", { ascending: false }).limit(500)),
      opt(sb.from("bookings").select("*").order("created_at", { ascending: false }).limit(50)),
    ]);
    Object.assign(DB, { inquiries: inq, milabrownclients: crm, profiles: p, modalities: m, library_items: l, retreats: r, email_log: em, email_inbox: inb, bookings: bk });
  }

      q(sb.from("retreat_attendance").select("*").eq("client_id", profileId).order("attended_on", { ascending: false })),
    ]);
    DB.client_services = s; DB.protocols = pr; DB.retreat_attendance = a;
  }

  // People = retreat guest cards and Serene Portal accounts, matched by email
  function people() {
    const map = new Map();
    DB.milabrownclients.forEach((c) => { const k = key(c.email) || "c:" + c.id; map.set(k, { key: k, crm: c, prof: null }); });
    DB.profiles.forEach((p) => { const k = key(p.email) || "p:" + p.id; const e = map.get(k); if (e) e.prof = p; else map.set(k, { key: k, crm: null, prof: p }); });
    return [...map.values()];
  }
  const nameOf = (p) => (p.crm && p.crm.name) || (p.prof && p.prof.full_name) || (p.prof && p.prof.email) || "(no name)";

  async function upload(bucket, file, folder) {
    const safe = file.name.toLowerCase().replace(/[^a-z0-9.\-]+/g, "-");
    const path = (folder ? folder + "/" : "") + Date.now() + "-" + safe;
    if (DEMO) return path;
    const { error } = await sb.storage.from(bucket).upload(path, file, { upsert: false, contentType: file.type || undefined });
    if (error) throw new Error("The file didn't upload. Please try again.");
    return path;
  }

  async function write(table, id, values) {
    if (DEMO) {
      const list = DB[table], i = id ? list.findIndex((x) => x.id === id) : -1;
      const row = { ...(i >= 0 ? list[i] : { id: "x" + Date.now(), created_at: new Date().toISOString() }), ...values };
      if (i >= 0) list[i] = row; else list.unshift(row);
      return row;
    }
    const t = realTable(table);
    return id ? q(sb.from(t).update(values).eq("id", id).select().single()) : q(sb.from(t).insert(values).select().single());
  }

  async function save(table, profileId) {
    const { out, files } = readForm(table);
    const row = editing[table];
    let tasks = null;
    if (table === "protocols") { tasks = (out.tasks || "").split("\n").map((x) => x.trim()).filter(Boolean); delete out.tasks; }
    if (PORTAL_TABLES.includes(table)) out.client_id = profileId;
    if (table === "client_docs") {
      if (!profileId) throw new Error("This client needs a Serene Portal login first.");
      if (!out.file_path && !files.file_path && !out.url && !out.body && !(row && (row.file_path || row.url))) throw new Error("Add a file, a link or the mantra text.");

          ${bookWho === "other" ? `<label for="bk-email" class="wide">Email<input id="bk-email" type="email" data-bk="email" value="${esc(bookEmail)}" placeholder="name@example.com"></label>` : ""}
        </div>
        ${s ? `<p class="small">Booking link for <b>${esc(s.name)}</b>: <a href="${svcLink(s.id)}" target="_blank" rel="noopener">open it ↗</a></p>` : `<p class="small muted">Choose a service to get its link.</p>`}
        <div class="actions"><button class="btn sm" type="button" data-bkmail ${s ? "" : "disabled"}>✉ Email link to client</button><button class="btn ghost sm" type="button" data-bkcopy ${s ? "" : "disabled"}>Copy link</button></div></div>
      ${DB.bookings.length ? `<div class="panel"><h3>Online bookings</h3><p class="small muted">Sessions booked through the booking form (the appointment itself is in Mindbody).</p><div class="list">${DB.bookings.slice(0, 30).map((b) => `<div class="item"><div><b>${esc([b.first_name, b.last_name].filter(Boolean).join(" ") || b.email)}</b> <span class="muted small">· ${esc(b.email || "")}</span>${b.sandbox ? ' <span class="pill paused">test</span>' : ""}${b.by_admin ? ' <span class="pill">booked by you</span>' : ""}<p class="small">${esc(b.service_name || "Session")} · ${esc(String(b.starts_at || "").replace("T", " ").slice(0, 16))}</p>${b.note ? `<p class="small muted">${esc(b.note)}</p>` : ""}</div></div>`).join("")}</div></div>` : ""}
      <div class="panel"><h3>All links</h3><div class="list">${SERVICES.map((x) => `<div class="item"><div><b>${esc(x.name)}</b> <span class="muted small">· ${esc(x.meta)}</span></div><div class="actions" style="margin:0;flex:none"><a class="btn ghost sm" href="${svcLink(x.id)}" target="_blank" rel="noopener">Open</a><button class="btn ghost sm" type="button" data-copy="${svcLink(x.id)}">Copy</button></div></div>`).join("")}</div></div>`;
  }

  function vEmails() {
    const s = qs.emails.toLowerCase();
    // This week (from Monday) and this month
    const now = new Date(), dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const weekStart = new Date(dayStart.getTime() - ((dayStart.getDay() + 6) % 7) * 864e5), monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const inbox = emBox === "inbox", list = inbox ? DB.email_inbox : DB.email_log, when = (m) => inbox ? m.received_at : m.sent_at;
    const inPeriod = (m, f) => f === "all" || new Date(when(m)) >= (f === "week" ? weekStart : monthStart);
    const nOf = (f) => list.filter((m) => inPeriod(m, f)).length;
    const rows = list.filter((m) => inPeriod(m, emFilter) && (!s || (inbox ? [m.from_name, m.from_email, m.subject, m.body] : [m.to_name, m.to_email, m.subject, m.body]).join(" ").toLowerCase().includes(s)));
    const people_ = people();
    const who = (em) => people_.find((p) => [p.crm && p.crm.email, p.prof && p.prof.email].some((e) => e && e.toLowerCase() === (em || "").toLowerCase()));
    const n = unread();
    const boxes = chips("box", emBox, [["inbox", `Inbox${n ? ` · ${n} new` : ` · ${DB.email_inbox.length}`}`], ["sent", `Sent · ${DB.email_log.length}`]]);
    let note = "";
    if (inbox && inboxState === "setup") note = `<div class="panel inbox-note"><h3>Connect your Gmail inbox</h3><p class="small muted">Replies to mila@milabrown.pro will appear here once Gmail is connected (Google Cloud project, read-only access, three secrets in Supabase). Until then, read them in Gmail.</p><div class="actions"><a class="btn sm" href="https://mail.google.com/mail/u/?authuser=milabrown.pro@gmail.com" target="_blank" rel="noopener">Open Gmail ↗</a></div></div>`;
    else if (inbox && inboxState.startsWith("error:")) note = `<p class="note err">Couldn't check Gmail: ${esc(inboxState.slice(6))}</p>`;
    const sub = inbox ? "Replies and new emails to mila@milabrown.pro, checked every few minutes. Click one to read it." : `${DB.email_log.length} email${DB.email_log.length === 1 ? "" : "s"} sent from the admin. Newest first; click one to read it.`;
    return head("mila@milabrown.pro", "Emails", sub) +
      `<div class="toolbar">${boxes}<span class="tb-sep"></span>${chips("em", emFilter, [["week", `This week · ${nOf("week")}`], ["month", `This month · ${nOf("month")}`], ["all", `All · ${list.length}`]])}${search("emails", inbox ? "Search sender, subject, text…" : "Search name, email, subject…")}
        ${inbox ? `<button class="btn ghost sm" type="button" data-insync ${syncing ? "disabled" : ""}>${syncing ? "Checking…" : "↻ Check for new"}</button>` : ""}<button class="btn sm" type="button" data-newmail>✉ New email</button></div>${note}
      <div class="stack">${inbox ? rows.map((m) => { const p = who(m.from_email); return `<details class="card mail-row in-row${m.read ? "" : " unread"}" data-inrow="${esc(m.id)}"><summary><div class="req-top"><h3>${m.read ? "" : '<i class="dot-new" aria-label="New"></i>'}${esc(m.subject || "(no subject)")}</h3><span class="small muted">${fmtWhen(m.received_at)}</span></div>
        <p class="small">From <b>${esc(m.from_name || m.from_email)}</b>${m.from_name ? ` <span class="muted">&lt;${esc(m.from_email)}&gt;</span>` : ""}${p ? ' <span class="pill booked">client</span>' : ""}${m.has_attachments ? ' <span class="pill">📎 attachment</span>' : ""}</p></summary>
        <p class="mail-full">${esc(m.body || m.snippet || "")}</p>
        <div class="actions"><button class="btn sm" type="button" data-mail="${esc(m.from_email)}" data-name="${esc(m.from_name || (p ? nameOf(p) : ""))}" data-resubj="${esc(m.subject || "")}">↩ Reply</button>${p ? `<button class="btn ghost sm" type="button" data-openclient="${esc(p.key)}">Open client</button>` : ""}<a class="btn ghost sm" href="${gmailLink(m)}" target="_blank" rel="noopener">Open in Gmail ↗</a><button class="btn ghost sm" type="button" data-inunread="${esc(m.id)}">Mark unread</button><button class="btn ghost sm" type="button" data-inarch="${esc(m.id)}">Remove</button></div></details>`; }).join("") ||
        `<div class="empty">${DB.email_inbox.length ? "No emails match." : inboxState === "setup" ? "Nothing here yet." : "No replies yet."}</div>`
      : rows.map((m) => { const p = who(m.to_email); return `<details class="card mail-row"><summary><div class="req-top"><h3>${esc(m.subject || "(no subject)")}</h3><span class="small muted">${fmtWhen(m.sent_at)}</span></div>
        <p class="small">To <b>${esc(m.to_name || m.to_email)}</b>${m.to_name ? ` <span class="muted">&lt;${esc(m.to_email)}&gt;</span>` : ""}</p></summary>
        <p class="mail-full">${esc(m.body || "")}</p>
        <div class="actions">${p ? `<button class="btn ghost sm" type="button" data-openclient="${esc(p.key)}">Open client</button>` : ""}<button class="btn sm" type="button" data-mail="${esc(m.to_email)}" data-name="${esc(m.to_name || "")}">✉ Write again</button></div></details>`; }).join("") ||
        `<div class="empty">${DB.email_log.length ? "No emails match." : "No emails sent yet. Use ✉ New email above, or ✉ Send email on a request or a client."}</div>`}</div>`;
  }

  function vArchive() {
    const s = qs.archive.toLowerCase();
    const items = [...(arcFilter === "cli" ? [] : DB.inquiries.filter((r) => r.archived).map((r) => ({ r, k: "inq", d: r.created_at || "" }))),
      ...(arcFilter === "inq" ? [] : DB.milabrownclients.filter((c) => c.archived).map((r) => ({ r, k: "cli", d: r.retreat_date || r.created_at || "" })))]
      .filter((x) => !s || [x.r.name, x.r.email, x.r.phone, x.r.notes, x.r.goal].join(" ").toLowerCase().includes(s))
      .sort((a, b) => String(b.d).localeCompare(String(a.d)));
    return head("No longer active", "Archive", "Archived requests and former clients. Restore brings them back.") +
      `<div class="toolbar">${chips("arc", arcFilter, [["all", "All"], ["inq", "Requests"], ["cli", "Former clients"]])}${search("archive", "Search archive…")}</div>
      <div class="stack">${items.map((x) => x.k === "inq" ? reqCard(x.r) : `<article class="card req done"><span class="pill cancelled" style="justify-self:start">Former client</span><div class="req-top"><h3>${esc(x.r.name || "(no name)")}</h3><span class="small muted">${x.r.retreat_date ? fmtDate(x.r.retreat_date) : ""}</span></div>
        ${x.r.email ? `<p class="small">${esc(x.r.email)}</p>` : ""}${x.r.notes ? `<p class="small muted">${esc(x.r.notes)}</p>` : ""}
        <div class="actions"><button class="btn ghost sm" type="button" data-archive="milabrownclients" data-id="${x.r.id}">Restore</button><button class="btn danger sm" type="button" data-del="milabrownclients" data-id="${x.r.id}">Delete</button></div></article>`).join("") || `<div class="empty">The archive is empty.</div>`}</div>`;
  }

  // ---------- events ----------
  const current = () => people().find((x) => x.key === sel);
  async function selectPerson(k) {
    sel = k; draft = null; editing = {}; openFolds.clear();
    const p = current();
    try { await loadPortal(p && p.prof && p.prof.id); } catch { toast("Couldn't load this client's portal."); }
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  }
  document.addEventListener("click", async (e) => {
    const T = (s) => e.target.closest(s);
    let el;
    if (T("[data-bkcopy]")) { const u = svcLink(bookSvc); try { await navigator.clipboard.writeText(u); toast("Link copied"); } catch { prompt("Copy this link:", u); } return; }
    if (T("[data-bkmail]")) {
      const s = SERVICES.find((x) => String(x.id) === String(bookSvc)); if (!s) return;
      let to = "", name = "";
      if (bookWho === "other") { to = bookEmail.trim(); } else { const p = people().find((x) => x.key === bookWho); if (p) { to = (p.crm && p.crm.email) || (p.prof && p.prof.email) || ""; name = nameOf(p); } }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) { toast("Choose a client or type a valid email first."); return; }
      openMail(to, name, null, { subject: `Book your ${s.name}`, body: `Here is the link to choose a time for your ${s.name} (${s.meta.replace(" · ", ", ")}):\n\n${svcLink(s.id)}\n\nPick any time that suits you. You'll get a confirmation and a reminder by email.\n\nSee you soon,` });
      return;
    }
    if (T("[data-newmail]")) { openBulk(); return; }
    if ((el = T("[data-mail]"))) { openMail(el.dataset.mail, el.dataset.name, el.dataset.inq, el.dataset.resubj ? { subject: /^re:/i.test(el.dataset.resubj) ? el.dataset.resubj : "Re: " + el.dataset.resubj } : null); return; }
    if (T("[data-insync]")) { syncInbox(true); return; }
    if ((el = T("[data-inunread]"))) { e.preventDefault(); const d = el.closest("details"); markRead(el.dataset.inunread, false); if (d) d.open = false; return; }
    if ((el = T("[data-inarch]"))) { const m = DB.email_inbox.find((x) => x.id === el.dataset.inarch); if (m) { if (!DEMO) { try { await sb.from("email_inbox").update({ archived: true }).eq("id", m.id); } catch { toast("Couldn't archive. Please try again."); return; } } DB.email_inbox = DB.email_inbox.filter((x) => x !== m); toast("Removed from the inbox (it stays in Gmail)"); render(); } return; }
    if (T("[data-mailclose]")) { $("mail-dlg").close(); return; }
    if ((el = T("[data-tab]"))) { tab = el.dataset.tab; editing = {}; draft = null; render(); return; }
    if ((el = T("[data-sel]"))) { selectPerson(el.dataset.sel); return; }
    if ((el = T("[data-openclient]"))) { tab = "clients"; selectPerson(el.dataset.openclient); return; }
    if ((el = T("[data-chip]"))) { const v = el.dataset.v; if (el.dataset.chip === "req") reqFilter = v; else if (el.dataset.chip === "cli") cliFilter = v; else if (el.dataset.chip === "lib") { libAud = v; if (v !== "own") libWho = ""; } else if (el.dataset.chip === "em") emFilter = v; else if (el.dataset.chip === "box") emBox = v; else arcFilter = v; render(); return; }
    if (T("[data-newclient]")) { draft = {}; sel = null; editing = {}; render(); return; }
    if (T("[data-canceldraft]")) { draft = null; render(); return; }
    if ((el = T("[data-confirm]"))) {
      const r = DB.inquiries.find((x) => x.id === el.dataset.confirm);
      const fmt = F.milabrownclients[3].o.some(([v]) => v && v === r.format) ? r.format : null;
      draft = { name: r.name, email: r.email, phone: r.phone, format: fmt, modalities: r.modalities, notes: r.goal ? "Would like to feel: " + r.goal + "\n\n" : "", _from: r.id };
      tab = "clients"; sel = null; editing = {}; render(); window.scrollTo({ top: 0 }); return;
    }
    if ((el = T("[data-addopt]"))) {
      const fs = $(el.dataset.addopt), inp = fs.querySelector(".add-row input"), v = inp.value.replace(/,/g, " ").trim();
      if (!v) return;
      if (![...fs.querySelectorAll(".checks input")].some((x) => x.value === v)) fs.querySelector(".checks").insertAdjacentHTML("beforeend", `<label class="check"><input type="checkbox" value="${esc(v)}" checked> ${esc(v)}</label>`);
      inp.value = ""; return;
    }
    if ((el = T("[data-copy]"))) { const v = el.dataset.copy; try { await navigator.clipboard.writeText(v); toast(/^https?:/.test(v) ? "Link copied" : "Email copied"); } catch { toast(v); } return; }
    if (T("[data-invite]") && DEMO) { e.preventDefault(); toast("Opens Supabase → Authentication → Users → Invite user."); return; }
    if ((el = T("[data-edit]"))) { editing[el.dataset.edit] = DB[el.dataset.edit].find((x) => x.id === el.dataset.id); render(); const f = document.querySelector(`[data-form="${el.dataset.edit}"]`); if (f) f.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    if ((el = T("[data-cancel]"))) { editing[el.dataset.cancel] = null; render(); return; }
    if ((el = T("[data-archive]"))) {
      const table = el.dataset.archive, r = DB[table].find((x) => x.id === el.dataset.id); el.disabled = true;
      try { await write(table, r.id, { archived: !r.archived }); if (!DEMO) await loadAll(); if (table === "milabrownclients" && !r.archived) sel = null; toast(r.archived ? "Restored" : "Archived"); render(); }
      catch { el.disabled = false; toast("Couldn't update. Please try again."); } return;
    }
    if ((el = T("[data-del]"))) {
      if (el.dataset.armed !== "1") { el.dataset.armed = "1"; el.textContent = "Confirm delete"; setTimeout(() => { if (el.isConnected) { el.dataset.armed = ""; el.textContent = "Delete"; } }, 4000); return; }
      const p = current();
      try { await remove(el.dataset.del, el.dataset.id, p && p.prof && p.prof.id); if (el.dataset.del === "milabrownclients") { sel = null; render(); } } catch { toast("Couldn't delete. Please try again."); } return;
    }
    if ((el = T("[data-open]"))) { if (DEMO) { toast("Opens the file in the live admin."); return; } const w = window.open("", "_blank"); const u = await fileUrl(el.dataset.bucket, el.dataset.open); if (u && w) w.location = u; else if (w) w.close(); return; }
  });
  document.addEventListener("change", async (e) => {
    if (e.target.matches && e.target.matches("[data-libwho]")) { libWho = e.target.value; render(); return; }
    if (e.target.matches && e.target.matches('.audience input[type="radio"]')) { const fs = e.target.closest(".audience"); fs.querySelector(".aud-list").hidden = e.target.value !== "some"; return; }
    const bk = e.target.closest("[data-bk]");
    if (bk) { if (bk.dataset.bk === "svc") bookSvc = bk.value; else if (bk.dataset.bk === "who") bookWho = bk.value; else bookEmail = bk.value; if (bk.dataset.bk !== "email") { render(); if (bookWho === "other" && bk.dataset.bk === "who") { const i = $("bk-email"); if (i) i.focus(); } } return; }
    const cb = e.target.closest("[data-contacted]"); if (!cb) return;
    const r = DB.inquiries.find((x) => x.id === cb.dataset.contacted); cb.disabled = true;
    try { await write("inquiries", r.id, { contacted: cb.checked }); r.contacted = cb.checked; render(); }
    catch { cb.checked = !cb.checked; cb.disabled = false; toast("Couldn't update. Please try again."); }
  });
  document.addEventListener("input", (e) => {
    if (e.target.matches && e.target.matches('[data-bk="email"]')) { bookEmail = e.target.value; return; }
    const s = e.target.closest("[data-search]"); if (!s) return;
    qs[s.dataset.search] = s.value; const pos = s.selectionStart; render();
    const again = document.querySelector(`[data-search="${s.dataset.search}"]`); if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  });
  document.addEventListener("submit", async (e) => {
    const f = e.target.closest("[data-form]"); if (!f) return;
    e.preventDefault();
    const btn = f.querySelector('[type="submit"]'); btn.disabled = true;
    try {
      if (f.dataset.form === "milabrownclients") {
        const { out } = readForm("milabrownclients");
        const p = draft ? null : current();
        const from = draft && draft._from;
        const saved = await write("milabrownclients", p && p.crm && p.crm.id, out);
        if (from) { try { await write("inquiries", from, { contacted: true }); } catch {} }
        draft = null;
        if (!DEMO) await loadAll();
        sel = key(saved.email) || "c:" + saved.id;
        toast("Client saved"); await selectPerson(sel);
      } else {
        const p = current();
        await save(f.dataset.form, p && p.prof && p.prof.id);
      }
    } catch (err) { toast(err.message && err.message.length < 120 ? err.message : "Couldn't save. Please try again."); btn.disabled = false; }
  });

  // ---------- auth ----------
  async function boot(user) {
    if (!DEMO) {
      const { data } = await sb.from("admins").select("user_id").eq("user_id", user.id).maybeSingle();
      if (!data) { $("login").hidden = false; $("app").hidden = true; $("login-err").textContent = "This account doesn't have admin access."; $("login-err").hidden = false; return; }
    }
    try { await loadAll(); } catch { toast("Couldn't load data. Please refresh."); }
    $("login").hidden = true; $("app").hidden = false; render();
    checkMindbody();
    syncInbox(false); setInterval(() => { if (!document.hidden) syncInbox(false); }, 5 * 60e3);
  }
  if (DEMO) {
    $("demo-flag").hidden = false; $("login").hidden = false; $("login-form").hidden = true; $("demo-enter").hidden = false;
    $("demo-enter").addEventListener("click", () => boot());
  } else {
    let booted = false;
    const go = (s) => { if (s && !booted) { booted = true; boot(s.user); } else if (!s) { $("login").hidden = false; $("app").hidden = true; } };
    sb.auth.getSession().then(({ data }) => go(data.session));
    sb.auth.onAuthStateChange((_e, s) => go(s));
  }
  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault(); e.stopPropagation();
    const email = $("login-email").value.trim(), pass = $("login-pass").value;
    $("login-err").hidden = true; $("login-ok").hidden = true; $("login-btn").disabled = true;
    if (pass) {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) { $("login-err").textContent = /invalid/i.test(error.message) ? "Email or password is incorrect." : "Couldn't sign in. Please try again."; $("login-err").hidden = false; }
      $("login-pass").value = "";
    } else {
      const r = await sendLink(email);
      $("login-ok").hidden = !r.ok; $("login-err").hidden = r.ok; if (!r.ok) $("login-err").textContent = r.msg;
    }
    $("login-btn").disabled = false;
  });
  $("logout").addEventListener("click", async () => { if (DEMO) location.reload(); else { await sb.auth.signOut(); location.reload(); } });
})();
</script>
</body>
</html>
