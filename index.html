<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serene Portal · Mila Brown</title>
<meta name="description" content="Serene Portal: the private client space of Mila Brown. Your protocols, sessions, retreats and practice library.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5b4b88">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap&subset=cyrillic">
<link rel="stylesheet" href="sanctuary.css">
<script>/* remember invite / password-reset links before the login library reads the address */
  (function () { const h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
    window.__AUTH_TYPE = h.get("type") || q.get("type") || "";
    window.__AUTH_ERR = h.get("error_code") || q.get("error_code") || h.get("error") || q.get("error") || ""; })();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="common.js"></script>
</head>
<body>

<div class="demo-flag" id="demo-flag" hidden></div>

<!-- Opening (shown while the saved sign-in is checked) -->
<div class="boot" id="boot" hidden role="status" aria-live="polite"><div class="boot-dot"></div><p data-i="opening"></p></div>

<!-- Login -->
<section class="login" id="login" hidden>
  <div class="login-card">
    <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-setlang="en">EN</button><button type="button" data-setlang="ru">RU</button></div>
    <div id="login-flower"></div>
    <p class="eyebrow" data-i="loginEyebrow"></p>
    <h1>Serene Portal</h1>
    <p class="muted" data-i="loginLead"></p>
    <form id="login-form" novalidate>
      <label for="login-email" data-i="yourEmail"></label>
      <input id="login-email" type="email" autocomplete="email" required placeholder="you@example.com">
      <label for="login-pass" data-i="password"></label>
      <input id="login-pass" type="password" autocomplete="current-password" required>
      <button class="btn" id="login-btn" type="submit" data-i="signIn"></button>
      <div class="login-links"><button class="linkbtn" type="button" id="forgot" data-i="forgot"></button><button class="linkbtn" type="button" id="use-link" data-i="useLink"></button></div>
    </form>
    <p class="note" id="login-ok" role="status" hidden></p>
    <p class="note err" id="login-err" role="alert" hidden></p>
    <p class="small muted"><span data-i="notClient"></span> <a href="https://milabrown.pro/#contact" data-i="getInTouch"></a></p>
    <button class="btn ghost" id="demo-enter" type="button" hidden data-i="openPreview"></button>
    <button class="linkbtn" id="demo-setpw" type="button" hidden data-i="previewSetPw"></button>
  </div>
</section>

<!-- Create / reset password -->
<section class="login" id="setpw" hidden>
  <div class="login-card">
    <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-setlang="en">EN</button><button type="button" data-setlang="ru">RU</button></div>
    <div id="setpw-flower"></div>
    <p class="eyebrow" data-i="loginEyebrow"></p>
    <h1 id="setpw-title"></h1>
    <p class="muted" id="setpw-lead"></p>
    <form id="setpw-form" novalidate>
      <label for="pw1" data-i="newPassword"></label>
      <input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="pw2" data-i="repeatPassword"></label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn" id="setpw-btn" type="submit" data-i="savePassword"></button>
    </form>
    <p class="note err" id="setpw-err" role="alert" hidden></p>
    <button class="linkbtn" type="button" id="setpw-skip" data-i="skipForNow"></button>
  </div>
</section>

<!-- App -->
<div id="app" hidden>
  <header class="top">
    <div class="in">
      <a class="brand" href="#home" data-go="home">Serene Portal<small>Mila Brown</small></a>
      <div class="who"><button class="who-btn" type="button" data-go="profile" id="who-name"></button><button class="btn ghost sm" id="logout" type="button" data-i="signOut"></button></div>
    </div>
  </header>
  <div class="shell">
    <div class="nav-wrap nav-b" id="nav-wrap">
      <button class="nav-arrow left" type="button" id="nav-left" aria-label="Scroll menu left" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <nav class="side" aria-label="Sections" id="nav"></nav>
      <button class="nav-arrow right" type="button" id="nav-right" aria-label="Scroll menu right" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="nav-dots" id="nav-dots" aria-hidden="true"></div>
    </div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<!-- Request bar (Modalities) -->
<div class="req-bar" id="req-bar" hidden role="region" aria-live="polite">
  <div class="req-top"><b id="req-count"></b><button class="linkbtn" type="button" id="req-clear" data-i="reqClear"></button></div>
  <input id="req-note" type="text" maxlength="500" data-ph="reqNote">
  <button class="btn" type="button" id="req-send" data-i="reqSend"></button>
</div>

    const t = T(), h = head(t.protEyebrow, t.nav.protocols, t.protText);
    if (!D.protocols.length) return h + empty(t.protEmpty);
    return h + `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))">${D.protocols.map((p) => `<article class="card">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="tag">${esc(p.phase || t.protocol)}</span><span class="pill ${esc(p.status)}">${st(p.status)}</span></div>
      <h3>${esc(p.title)}</h3>${p.start_date ? `<p class="small muted">${t.started} ${fmtDate(p.start_date)}</p>` : ""}
      ${p.summary ? `<p class="muted">${esc(p.summary)}</p>` : ""}
      <div data-bar="${p.id}">${progress(p)}</div>
      ${(p.protocol_tasks || []).length ? `<ul class="tasks">${p.protocol_tasks.map((x) => `<li class="${x.done ? "done" : ""}"><label><input type="checkbox" data-task="${x.id}" data-protocol="${p.id}" ${x.done ? "checked" : ""}><span>${esc(x.text)}</span></label></li>`).join("")}</ul>` : ""}
      ${p.file_path ? `<div class="actions"><a class="btn sm" href="#" data-bucket="protocols" data-file="${esc(p.file_path)}">${t.openPdf}</a></div>` : ""}
    </article>`).join("")}</div>`;
  }

  function retreats() {
    const t = T();
    const mine = D.attendance.length ? `<div class="timeline">${D.attendance.map((a) => `<article class="row"><p class="date">${fmtDate(a.attended_on)}</p><div><h3>${esc(a.title || (a.retreats && a.retreats.title) || t.retreat)}</h3>${a.notes ? `<p class="muted">${esc(a.notes)}</p>` : ""}</div><span class="pill ${esc(a.status)}">${st(a.status)}</span></article>`).join("")}</div>`
      : empty(t.retEmpty);
    const offer = D.retreats.filter((r) => !r.ends_on || r.ends_on >= today());
    return head(t.nav.retreats, t.nav.retreats) + `<h3 style="font-size:1.6rem;margin:4px 0 12px">${t.myRetreats}</h3>${mine}
      <h3 style="font-size:1.6rem;margin:30px 0 12px">${t.upcoming}</h3>
      ${offer.length ? `<div class="grid">${offer.map((r) => `<article class="card"><span class="tag">${r.starts_on ? fmtDate(r.starts_on) + (r.ends_on && r.ends_on !== r.starts_on ? " – " + fmtDate(r.ends_on) : "") : t.anyDate}</span><h3>${esc(r.title)}</h3>
        ${r.format ? `<p class="small">${esc(r.format)}</p>` : ""}${r.description ? `<p class="muted">${esc(r.description)}</p>` : ""}${r.price ? `<p class="small"><b>${esc(r.price)}</b></p>` : ""}
        ${r.signup_url ? `<div class="actions"><a class="btn sm" href="${esc(r.signup_url)}" target="_blank" rel="noopener">${t.learnBook}</a></div>` : ""}</article>`).join("")}</div>` : empty(t.retNone)}`;
  }

  function library() {
    const t = T();
    const kinds = Object.keys(t.kinds).filter((k) => k === "all" || D.library.some((x) => x.kind === k));
    const items = D.library.filter((x) => libFilter === "all" || x.kind === libFilter);
    const h = head(t.libEyebrow, t.nav.library, t.libText);
    if (!D.library.length) return h + empty(t.libEmpty);
    return h + `<div class="filters" role="group" aria-label="${t.nav.library}">${kinds.map((k) => `<button class="chip" type="button" data-lib="${k}" aria-pressed="${k === libFilter}">${t.kinds[k]}</button>`).join("")}</div>
      <div class="grid">${items.map((x) => `<article class="card"><span class="tag">${t.kind1[x.kind] || ""}</span><h3>${esc(x.title)}</h3>
        ${x.description ? `<p class="muted">${esc(x.description)}</p>` : ""}${x.kind === "mantra" && x.body ? `<p class="mantra">${esc(x.body)}</p>` : ""}
        <div class="actions">${x.file_path ? `<a class="btn sm" href="#" data-bucket="library" data-file="${esc(x.file_path)}">${x.kind === "audio" ? t.listen : t.open}</a>` : ""}
        ${x.url ? `<a class="btn ${x.file_path ? "ghost " : ""}sm" href="${esc(x.url)}" target="_blank" rel="noopener">${x.kind === "webinar" ? t.watch : t.openLink}</a>` : ""}</div></article>`).join("")}</div>`;
  }

  function profile() {
    const t = T(), p = D.profile;
    return head(t.profEyebrow, t.nav.profile, t.profText) + `
      <form class="panel" id="profile-form" novalidate><h3>${t.details}</h3>
        <div class="fgrid">
          <label for="pf-name">${t.fullName}<input id="pf-name" autocomplete="name" maxlength="120" value="${esc(p.full_name || "")}"></label>
          <label for="pf-phone">${t.phone}<input id="pf-phone" type="tel" autocomplete="tel" maxlength="40" value="${esc(p.phone || "")}"></label>
          <label for="pf-contact">${t.contactPref}<select id="pf-contact">${Object.keys(t.contacts).map((k) => `<option value="${k}" ${(p.contact_pref || "") === k ? "selected" : ""}>${t.contacts[k]}</option>`).join("")}</select></label>
          <label for="pf-lang">${t.language}<select id="pf-lang"><option value="en" ${getLang() === "en" ? "selected" : ""}>English</option><option value="ru" ${getLang() === "ru" ? "selected" : ""}>Русский</option></select></label>
          <p class="small muted wide">${t.langNote}</p>
        </div>
        <div class="actions"><button class="btn" type="submit">${t.save}</button></div>
      </form>
      <form class="panel" id="password-form" novalidate><h3>${t.pwPanel}</h3>
        <p class="small muted">${t.pwPanelText}</p>
        <div class="fgrid"><label for="pp1">${t.newPassword}<input id="pp1" type="password" autocomplete="new-password" minlength="8"></label>
          <label for="pp2">${t.repeatPassword}<input id="pp2" type="password" autocomplete="new-password" minlength="8"></label></div>
        <p class="note err" id="pp-err" role="alert" hidden></p>
        <div class="actions"><button class="btn ghost" type="submit">${t.changePassword}</button></div>
      </form>
      <form class="panel" id="email-form" novalidate><h3>${t.loginEmail}</h3>
        <p class="muted">${esc(p.email || "")}</p>
        <div class="fgrid"><label for="pf-email" class="wide">${t.newEmail}<input id="pf-email" type="email" autocomplete="email"></label></div>
        <p class="small muted">${t.emailNote}</p>
        <div class="actions"><button class="btn ghost" type="submit">${t.changeEmail}</button></div>
      </form>`;
  }
})();
</script>
</body>
</html>
